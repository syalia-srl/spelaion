# Tach — module dependency boundaries.
# Run: uv run tach check
# Sync with actual imports: uv run tach sync

exclude = [
    "**/__pycache__/**",
    "tests/**",
]
source_roots = [
    "src",
]
exact = true
# Without this, tach reads .gitignore files above the repo, and a checkout
# nested in an ignored folder hides src from it.
respect_gitignore = false
forbid_circular_dependencies = false

# ── Leaf modules (no spelaion.* dependencies) ────────────────────────────

[[modules]]
path = "spelaion.ast"
depends_on = []

[[modules]]
path = "spelaion.vfs"
depends_on = []

[[modules]]
path = "spelaion.runtime"
depends_on = []

[[modules]]
path = "spelaion.policy"
depends_on = []

# ── Core layers ─────────────────────────────────────────────────────────

[[modules]]
path = "spelaion.tools"
depends_on = ["spelaion.runtime"]

[[modules]]
path = "spelaion.parser"
depends_on = ["spelaion.ast"]

[[modules]]
path = "spelaion.commands"
depends_on = ["spelaion.exec", "spelaion.runtime", "spelaion.vfs"]

[[modules]]
path = "spelaion.exec"
depends_on = [
    "spelaion.ast",
    "spelaion.commands",
    "spelaion.parser",
    "spelaion.runtime",
    "spelaion.semantics",
]

[[modules]]
path = "spelaion.semantics"
depends_on = [
    "spelaion.ast",
    "spelaion.commands",
    "spelaion.exec",
]

# ── Entry points ────────────────────────────────────────────────────────

[[modules]]
path = "spelaion.api"
depends_on = [
    "spelaion.exec",
    "spelaion.parser",
    "spelaion.policy",
    "spelaion.runtime",
    "spelaion.semantics",
    "spelaion.tools",
    "spelaion.vfs",
]

[[modules]]
path = "spelaion.cli"
depends_on = ["spelaion.api", "spelaion.ast"]

# ── Sandbox ─────────────────────────────────────────────────────────────

[[modules]]
path = "spelaion._types"
depends_on = []

[[modules]]
path = "spelaion._truncate"
depends_on = []

[[modules]]
path = "spelaion._shell"
depends_on = [
    "spelaion._truncate",
    "spelaion._types",
    "spelaion.exec",
    "spelaion.parser",
    "spelaion.policy",
    "spelaion.runtime",
    "spelaion.tools",
    "spelaion.vfs",
]

[[modules]]
path = "spelaion._wire"
depends_on = ["spelaion._types"]

[[modules]]
path = "spelaion._child"
depends_on = [
    "spelaion._shell",
    "spelaion._types",
    "spelaion._wire",
    "spelaion.runtime",
    "spelaion.vfs",
]

[[modules]]
path = "spelaion.sandbox"
depends_on = [
    "spelaion._child",
    "spelaion._types",
    "spelaion._wire",
    "spelaion.vfs",
]
