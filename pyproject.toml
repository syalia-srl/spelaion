[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spelaion"
version = "0.1.0"
description = "A bash for agents, run from Python, with nothing real behind it"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Syalia S.R.L."}]
keywords = ["bash", "shell", "virtual", "ai", "agent", "sandbox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
    "Topic :: System :: Shells",
]
dependencies = [
    "tree-sitter>=0.24.0",
    "tree-sitter-bash>=0.23.0",
    "wasmtime>=50.0.1",
]

[project.urls]
Homepage = "https://github.com/syalia-srl/spelaion"
Repository = "https://github.com/syalia-srl/spelaion"
Issues = "https://github.com/syalia-srl/spelaion/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "pyright>=1.1",
    "tach>=0.20",
    "pre-commit>=4.0",
]

[project.scripts]
spelaion = "spelaion.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spelaion"]

[tool.uv]
default-groups = ["dev"]

# --------------------------------------------------------------------------
# Testing
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
markers = [
    "wasi: needs the CPython for WASI build (downloaded once into the cache)",
]

# --------------------------------------------------------------------------
# Ruff — linter AND formatter (replaces flake8, pylint, black, isort)
# --------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
# Vendored third-party code, kept as released.
extend-exclude = ["src/spelaion/python/vendor"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C90",    # mccabe complexity
    "PL",     # pylint
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "PLC0415",  # import-outside-top-level — deferred imports break circular deps
    "PLR0913",  # too-many-arguments — unavoidable in evaluator constructors
    "PLR2004",  # magic-value-comparison — noisy for exit codes and test assertions
    "PLR0911",  # too-many-return-statements — pattern-matching dispatch is fine
    "PLR0912",  # too-many-branches — same reason
    "PLR0915",  # too-many-statements — complex evaluators are inherently long
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# --------------------------------------------------------------------------
# Pyright — type checking in strict mode (replaces mypy)
# --------------------------------------------------------------------------

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = ["tests", "**/__pycache__", "src/spelaion/python/vendor"]
# Relaxations — only what's genuinely unfixable
reportUnusedFunction = "warning"
reportUnnecessaryComparison = "warning"
reportMissingTypeArgument = "warning"
