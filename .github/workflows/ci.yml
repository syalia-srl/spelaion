name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type Check (Pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run pyright

  architecture:
    name: Architecture (Tach)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run tach check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      # CPython for WASI for the wasi-marked tests; the key is the build's sha256.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/spelaion
          key: python-wasi-8de7834105edef8db8a13299e2587cf8945021dd8764f2691d83bbc25129dfa2-${{ hashFiles('uv.lock') }}
          restore-keys: python-wasi-8de7834105edef8db8a13299e2587cf8945021dd8764f2691d83bbc25129dfa2-
      - run: uv run pytest tests/ -q --tb=short
