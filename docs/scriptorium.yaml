# spelaion, the book. Every Python block runs against the installed package when
# the book renders (`make docs`); the chapters tangle their programs into examples/.
theme: book
base-url: https://syalia-srl.github.io/spelaion/
execute: {timeout: 120, freeze: file}

vars:
  title: "spelaion"
  subtitle: "A bash for agents, run from Python, with nothing real behind it"

files:
  - chapters/00-index.md
  - chapters/01-quick-start.md
  - chapters/02-mounts.md
  - chapters/03-limits.md
  - chapters/04-python.md
  - chapters/05-host-commands.md
  - chapters/06-images.md
  - chapters/07-own-loop.md
  - chapters/08-mcp.md
  - chapters/09-harnesses.md
  - chapters/11-testing-with-bash.md

outputs:
  site:
    format: docs
    dir: site
    repo-url: https://github.com/syalia-srl/spelaion
    version: auto
  # Rendered after the site, into it, so the web book links it for download.
  print:
    format: pdf
    file: site/spelaion.pdf
